<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas DevCLub</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>

</head>


<body>
    <video class="video" autoplay muted loop>
        <source src="./assets/fundomoedas.mp4" type="video/mp4">
    </video>

    <div class="container">
        <img src="./assets/img-money-symbols.png" class="moneySymbols">
        <main>
            <h1>Conversor de Moedas simplificado </h1>
            <p>Simplified currency converter</p>
        </main>

        <div class="input-container">
            <p>Converter <b>de:</b></p>
            <select id="moedaOrigem" placeholder="Escolha a moeda de origem">
                <option value="BRL Real Brasileiro">R$ Real Brasileiro</option>
            </select>

            <label>Converter <b>para:</b></label>

            <select id="moedaDestino" placeholder="Escolha a moeda de destino">

                <option value="USD Dólar americano"><b>US$ </b>Dólar americano</option>
                <option value="EUR euro"><b>€ </b>Euro</option>
                <option value="JPY Iene japonês"><b>¥ </b>Iene japonês</option>
                <option value="GBP Libra esterlina"><b>£ </b>Libra esterlina</option>
                <option value="BTC Bitcoin"><b>₿ </b>Bitcoin</option>
            </select>
            <label for="valor">Digite o valor a converter:</label>
            <input type="number" class="input-valor" id="valor" placeholder="R$ 10,000.00">
            <button id="botao-converter">Converter</button>

        </div>
        <div class="resultado">
            <div class="moeda-a-converter">
                <img src="./assets/REAL.png" class="real-img">
                <p class="NomeMoedaOrigem">Real</p>
                <p class="ValorMoedaOrigem"> 0,00</p>
            </div>

            <img src="./assets/Seta.png" class="arrow.png">

            <div class="moeda-convertida">
                <img src="./assets/USD.png" class="dolar-img">
                <p class="NomeMoedaConvertida">US$ </p>
                <p class="ValorMoedaConvertida">0,00</p>

                <!-- <img src="./assets/euro.png" class="euro-img">
                <img src="./assets/YENE.png" class="iene-img">
                <img src="./assets/Libra.png" class="libra-img">
                <img src="./assets/bitcoin.png" class="bitcoin-img">   -->

            </div>

        </div>
    </div>

</html>
